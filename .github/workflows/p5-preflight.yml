name: P5 read-only execution preflight
on:
  pull_request:
    branches: [registry-distribution-validation]
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load and validate exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/Spyrex1973/ejb-ha-deployment-test/actions/artifacts/15179208147/zip > evidence.zip
          echo 'ea5e3e690566ac2540053447a460b0ad494713fa15122c98031848c26e23af29  evidence.zip' | sha256sum -c -
          unzip -q evidence.zip -d evidence
          test "$(cat evidence/revision.txt)" = b99512ca44139b73a0964ffc0e072243841cea74
          (cd evidence && sha256sum -c probe-image.sha256)
          docker load -i evidence/probe-image.tar
          test "$(docker image inspect --format '{{.Id}}' ejb-probe:1.0.1)" = sha256:1fe494f3672aa6f70938d1ec17298e5d5c8e375da50a9824b4693bfe46baa5bf
      - name: Inspect anonymous registry access without publication
        run: |
          set -eu
          image=ghcr.io/spyrex1973/ejb-ha-deployment-test/rollback-probe
          if docker manifest inspect "$image:1.0.1" > manifest.json; then
            echo "Existing tag anonymously readable; no publication performed"
            jq -r '.config.digest // "index or unknown"' manifest.json
          else
            echo "Anonymous visibility not established; publication remains blocked"
          fi
      - name: Inspect package metadata with scoped read token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          endpoint='users/Spyrex1973/packages/container/ejb-ha-deployment-test%2Frollback-probe'
          if gh api "$endpoint" > package.json; then
            jq '{name,visibility,package_type,version_count}' package.json
          else
            echo "Package metadata unavailable; absence or visibility cannot be established"
          fi
      - name: Authenticated registry manifest lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          image=ghcr.io/spyrex1973/ejb-ha-deployment-test/rollback-probe
          if printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
            echo "REGISTRY_LOGIN_OK"
            if docker manifest inspect "$image:1.0.1" > authenticated-manifest.json; then
              echo "AUTHENTICATED_MANIFEST_OK"
              jq '{mediaType,config_digest:.config.digest,manifests:[.manifests[]? | {digest,platform}]}' authenticated-manifest.json
            else
              echo "AUTHENTICATED_MANIFEST_UNAVAILABLE"
            fi
          else
            echo "REGISTRY_LOGIN_FAILED"
          fi
