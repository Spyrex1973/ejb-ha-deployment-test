name: Inspector anonymous registry verification
on:
  push:
    paths:
      - '.github/workflows/inspector-anonymous-verification.yml'
permissions: {}
jobs:
  anonymous:
    runs-on: ubuntu-latest
    steps:
      - name: Pull pinned image with empty credential store
        run: |
          set -eu
          export DOCKER_CONFIG="$(mktemp -d)"
          image=ghcr.io/spyrex1973/ejb-host-writer-inspector@sha256:4e6ab2619a744a2b8a92e048d40454dff545149ce2bff1aed142556ddd65135d
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{.Id}}')" = sha256:4e6ab2619a744a2b8a92e048d40454dff545149ce2bff1aed142556ddd65135d
          echo ANONYMOUS_PINNED_PULL_VERIFIED
