name: Inspector pinned transfer preflight
on:
  push:
    paths:
      - '.github/workflows/host-inspector-transfer.yml'
permissions:
  actions: read
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/${{ github.repository }}/actions/artifacts/15254370061/zip > artifact.zip
          echo 'b3a05b299b75126ed3a704b42d8694d6e407be200ede70e4b57d7edd006ab5c9  artifact.zip' | sha256sum -c -
          unzip -q artifact.zip -d evidence
          sha256sum -c evidence/archive.sha256
          cd evidence
          gzip -dc inspector.tar.gz | docker load
          test "$(docker image inspect inspector-test --format '{{.Id}}')" = "$(cat image-id.txt)"
          python3 -c 'import json; r=json.load(open("host-security.json")); assert not r["signal_permission"] and not r["process_root_access"]'
          docker image inspect inspector-test --format '{{.Id}} {{.Architecture}}'
      - name: Publish only dedicated inspector candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          image=ghcr.io/spyrex1973/ejb-host-writer-inspector
          tag="$image:0.1.1-ci46122065139"
          expected=sha256:4e6ab2619a744a2b8a92e048d40454dff545149ce2bff1aed142556ddd65135d
          test "$(docker image inspect inspector-test --format '{{.Id}}')" = "$expected"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag inspector-test "$tag"
          docker push "$tag"
          digest=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$image@" | head -n1)
          test -n "$digest"
          docker image rm "$tag" inspector-test
          docker pull "$digest"
          test "$(docker image inspect "$digest" --format '{{.Id}}')" = "$expected"
          printf '%s\n' "$digest" "$expected" > registry-evidence.txt
          docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        with:
          name: inspector-registry-evidence
          path: registry-evidence.txt
          retention-days: 7
