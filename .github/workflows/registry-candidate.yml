name: Registry candidate publication
on:
  pull_request:
    paths:
      - '.github/workflows/registry-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api repos/Spyrex1973/ejb-ha-deployment-test/actions/artifacts/15177222540/zip > evidence.zip
          echo '762535ecf3c1b13754dea86df09b3d18b4b1d142bbf4fecc9a01ec6b15897a7e  evidence.zip' | sha256sum -c -
          unzip -q evidence.zip -d evidence
          cd evidence
          test "$(cat revision.txt)" = 86925a5a61e35c3300f0bd376150c31b1c1db988
          sha256sum -c probe-image.sha256
          docker load -i probe-image.tar
          test "$(docker image inspect --format '{{.Id}}' ejb-probe:1.0.1)" = "$(cat image-id.txt)"
          test "$(cat image-id.txt)" = sha256:e52937c9eb3cbcd85b8fc7f8d706802e8cdebb410d1fd741f1d21ced39b9b755
          docker tag ejb-probe:1.0.1 ghcr.io/spyrex1973/ejb-ha-deployment-test/rollback-probe:1.0.1
          test "$(docker image inspect --format '{{.Id}}' ghcr.io/spyrex1973/ejb-ha-deployment-test/rollback-probe:1.0.1)" = "$(cat image-id.txt)"
          docker image inspect --format '{{json .Config.Labels}}' ejb-probe:1.0.1
          echo 'Validation only; publication disabled pending visibility, cost and label acceptance.'
